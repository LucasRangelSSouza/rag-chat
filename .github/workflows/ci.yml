name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Build and interface tests (accessibility included)
        run: npm run test:e2e

  images:
    runs-on: ubuntu-latest
    needs: [backend, interface]
    steps:
      - uses: actions/checkout@v4
      - name: Build both container images
        run: |
          docker build -t rag-chat-web:ci .
          docker build -t rag-chat-backend:ci backend
